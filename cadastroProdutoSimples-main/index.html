<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo!</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index.css">
    
    
</head>
<body>
    <main class="container">
        <h1>Cadastro de Produtos</h1>
        <form action="#" method="post" id="cadrastroProduto">
            
            <div class="row">
                
                <div class="form-field col-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" name="nome" id="nome" class="form-control" required >
                </div>
                
                <div class="form-field col-6">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number" class="form-control" name="valor" 
                    id="valor" placeholder="0.00" required>
                </div>
            </div>
            
            <br>
            
            
            <div class="row">
                <div class="btn-group botoes col-12">
                    <button type="submit" class="btn-solid theme-primary" 
                    id='botaosubmit' >Adicionar</button>
                    
                </div>
            </div>
        </form>
        <br>
        
        
        <table class="table">
            <thead>
                <tr>
                    <th scope="col" >ID</th>
                    <th scope="col" >nome</th>
                    <th scope="col" >Valor</th>
                    <th scope="col" >editar</th>
                </tr>
            </thead>
            <tbody id="conteudo-tabela">
                
            </tbody>
            <tfoot>
                <tr>
                    <td></td>
                    <td></td>
                    <td>valor Total: <span></span> </td>
                    
                    
                    
                </tr>
            </tfoot>
        </table>
        <tfoot>
            
            <tr>
                <td> </td>
                <td> </td>
                <td> </td>
                
            </tr>
            
            
            
        </tfoot>
        <br>
        <div class="row">
            <div class="text-end">
                Valor total: <span id="valorTotal">0.00</span>
            </div>
        </div>
    </main>
    <script>
        let form = document.querySelector('#cadrastroProduto')
        form.addEventListener('submit',function(event){
            event.preventDefault();
            console.log(event);
            capturaFormulario();
        })
        
        let botaosubmit = document.querySelector('#botaosubmit') 
        botaosubmit.addEventListener('mouseover', function(){ 
            console.log('oi')
        })



        function capturaFormulario() {
            
            let nome = document.querySelector("#nome")
            let valor = document.querySelector("#valor")  
            let tbody = document.querySelector('#conteudo-tabela')
            let produto = {
                nome: nome.value,
                valor: valor.value
            }
            
            let tr = document.createElement('tr')
            let tdID = document.createElement('td')
            let tdNome = document.createElement('td')
            let tdValor = document.createElement('td')
            let tdEditar = document.createElement('td')
            
            tdNome.textContent = produto.nome
            tdValor.textContent = produto.valor
            tdEditar.textContent = 'Alterar - Remover'
            
            tr.append(tdID)
            tr.append(tdNome)
            tr.append(tdValor)
            tr.append(tdEditar)
            tbody.append(tr)
            
        }
    </script>
</body>
</html>
