<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo!</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index.css">
    
    
</head>
<body>
    <main class="container">
        <h1>Cadastro de Produtos</h1>
        <form action="#" method="post">
            
            <div class="row">
                
                <div class="form-field col-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" name="nome" id="nome" class="form-control" >
                </div>
                
                <div class="form-field col-6">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number" class="form-control" name="valor" id="valor" placeholder="0.00">
                </div>
            </div>
            
            <div class="row">
                
                <div class="col-4">
                    esta é uma coluna
                </div>
                
                <div class="col-8">
                    esta é a segunda coluna
                </div>
                
            </div>
            
            
            
            <div class="row">
                <div class="btn-group botoes col-12">
                    <button type="button" class="btn-solid theme-primary " onclick="capturaFormulario()">Adicionar</button>
                    
                </div>
            </div>
        </form>
        <br>
        
        
        <table class="table">
            <thead>
           <tr>
             <th scope="col" >ID</th>
             <th scope="col" >nome</th>
             <th scope="col" >Valor</th>
             
           </tr>
           </thead>
           <tbody id="conteudo-tabela">
            <tr>
             <td>1</td>
             <td>HD</td>
             <td>100</td>
             
           </tr>
           </tbody>
        </table>
        <tfoot>

          <tr>
             <td> </td>
             <td> </td>
             <td>total:</td>
             
           </tr>



        </tfoot>
        <br>
        <div class="row">
            <div class="text-end">
                Valor total: <span id="valorTotal">0.00</span>
            </div>
        </div>
    </main>
    <script>
        function capturaFormulario() {
            let nome = document.querySelector("#nome")
            let valor = document.querySelector("#valor")  
            let tbody = document.querySelector('#conteudo-tabela')
            let produto = {
                nome: nome.value,
                valor: valor.value
            }
            
           let tr = document.createElement('tr')
           let tdID = document.createElement('td')
            let tdNome = document.createElement('td')
           let tdValor = document.createElement('td')


           tdNome.textContent = produto.nome
           tdValor.textContent = produto.valor


           tr.append(tdID)
           tr.append(tdNome)
           tr.append(tdValor)

           tbody.append(tr)
            
        }
    </script>
</body>
</html>
